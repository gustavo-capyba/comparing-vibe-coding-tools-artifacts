openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wildlife Track API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: sightings
    description: Animal sightings
  - name: notifications
    description: Notifications and subscriptions
  - name: emergencies
    description: Emergency alerts
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sightings:
    get:
      operationId: listSightings
      tags: [sightings]
      summary: List all sightings
      parameters:
        - name: animalType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of sightings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sighting"
    post:
      operationId: createSighting
      tags: [sightings]
      summary: Report a new sighting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSightingBody"
      responses:
        "201":
          description: Sighting created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sighting"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sightings/{id}:
    get:
      operationId: getSighting
      tags: [sightings]
      summary: Get a sighting by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sighting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sighting"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sightings/recent:
    get:
      operationId: getRecentSightings
      tags: [sightings]
      summary: Get recent sightings (last 24h)
      responses:
        "200":
          description: Recent sightings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sighting"

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [notifications]
      summary: Get user subscriptions
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSubscription
      tags: [notifications]
      summary: Subscribe to an animal type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/{id}:
    delete:
      operationId: deleteSubscription
      tags: [notifications]
      summary: Unsubscribe from an animal type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unsubscribed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Get user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /emergencies:
    get:
      operationId: listEmergencies
      tags: [emergencies]
      summary: List emergency alerts
      responses:
        "200":
          description: Emergency list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Emergency"
    post:
      operationId: createEmergency
      tags: [emergencies]
      summary: Trigger an emergency alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmergencyBody"
      responses:
        "201":
          description: Emergency alert created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Emergency"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/animal-counts:
    get:
      operationId: getAnimalCounts
      tags: [stats]
      summary: Get sighting counts grouped by animal type
      responses:
        "200":
          description: Animal counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnimalCount"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        nationality:
          type: string
        phone:
          type: string
        vehiclePlate:
          type: string
        documentType:
          type: string
        documentValue:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - nationality
        - phone
        - vehiclePlate
        - documentType
        - documentValue
        - createdAt

    RegisterBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string
        nationality:
          type: string
          enum: [BR, US]
        phone:
          type: string
        vehiclePlate:
          type: string
        documentType:
          type: string
        documentValue:
          type: string
      required:
        - email
        - password
        - name
        - nationality
        - phone
        - vehiclePlate
        - documentType
        - documentValue

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    Sighting:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        animalType:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        notes:
          type: ["string", "null"]
        crowdCount:
          type: integer
        notificationsSuppressed:
          type: boolean
        timestamp:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userName
        - animalType
        - latitude
        - longitude
        - notes
        - crowdCount
        - notificationsSuppressed
        - timestamp
        - createdAt

    CreateSightingBody:
      type: object
      properties:
        animalType:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        notes:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - animalType
        - latitude
        - longitude

    Subscription:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        animalType:
          type: string
        emailNotify:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - animalType
        - emailNotify
        - createdAt

    CreateSubscriptionBody:
      type: object
      properties:
        animalType:
          type: string
        emailNotify:
          type: boolean
      required:
        - animalType

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        sightingId:
          type: integer
        animalType:
          type: string
        message:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - sightingId
        - animalType
        - message
        - isRead
        - createdAt

    Emergency:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, resolved]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userName
        - latitude
        - longitude
        - description
        - status
        - createdAt

    CreateEmergencyBody:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        description:
          type: string
      required:
        - latitude
        - longitude

    StatsSummary:
      type: object
      properties:
        totalSightings:
          type: integer
        sightingsToday:
          type: integer
        activeEmergencies:
          type: integer
        totalUsers:
          type: integer
        recentSightings:
          type: integer
      required:
        - totalSightings
        - sightingsToday
        - activeEmergencies
        - totalUsers
        - recentSightings

    AnimalCount:
      type: object
      properties:
        animalType:
          type: string
        count:
          type: integer
      required:
        - animalType
        - count
