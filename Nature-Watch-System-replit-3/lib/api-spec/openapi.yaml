openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Wildlife Track API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile management
  - name: sightings
    description: Animal sighting reports
  - name: subscriptions
    description: Animal type notification subscriptions
  - name: notifications
    description: In-app notifications
  - name: emergencies
    description: Emergency alerts
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    put:
      operationId: upsertMe
      tags: [users]
      summary: Create or update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error

  /sightings:
    get:
      operationId: getSightings
      tags: [sightings]
      summary: List all sightings
      parameters:
        - name: animalType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of sightings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sighting"
    post:
      operationId: createSighting
      tags: [sightings]
      summary: Report a new animal sighting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSightingBody"
      responses:
        "201":
          description: Created sighting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sighting"
        "400":
          description: Validation error

  /sightings/{id}:
    get:
      operationId: getSighting
      tags: [sightings]
      summary: Get a single sighting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sighting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sighting"
        "404":
          description: Not found

  /sightings/{id}/nearby-users:
    get:
      operationId: getSightingNearbyUsers
      tags: [sightings]
      summary: Get count of users near this sighting (crowd control)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: radiusKm
          in: query
          schema:
            type: number
            default: 1
      responses:
        "200":
          description: Nearby user count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NearbyUsersResult"

  /subscriptions:
    get:
      operationId: getSubscriptions
      tags: [subscriptions]
      summary: Get current user subscriptions
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Subscribe to an animal type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscriptions/{id}:
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Unsubscribe from an animal type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: Get current user notifications
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUpdateResult"

  /emergencies:
    get:
      operationId: getEmergencies
      tags: [emergencies]
      summary: List all active emergency alerts
      responses:
        "200":
          description: List of emergencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Emergency"
    post:
      operationId: createEmergency
      tags: [emergencies]
      summary: Trigger an emergency alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmergencyBody"
      responses:
        "201":
          description: Created emergency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Emergency"

  /emergencies/{id}/resolve:
    patch:
      operationId: resolveEmergency
      tags: [emergencies]
      summary: Resolve an emergency alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved emergency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Emergency"

  /stats/overview:
    get:
      operationId: getStatsOverview
      tags: [stats]
      summary: Get dashboard statistics overview
      responses:
        "200":
          description: Stats overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsOverview"

  /stats/animal-breakdown:
    get:
      operationId: getAnimalBreakdown
      tags: [stats]
      summary: Get sightings count grouped by animal type
      responses:
        "200":
          description: Animal breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnimalBreakdownItem"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent sightings and emergencies as activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Recent activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /users/me/location:
    put:
      operationId: updateMyLocation
      tags: [users]
      summary: Update current user GPS location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationBody"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationUpdateResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: ["string", "null"]
        name:
          type: ["string", "null"]
        nationality:
          type: string
        phone:
          type: string
        vehicleLicensePlate:
          type: string
        documentType:
          type: string
        documentNumber:
          type: string
        latLng:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - clerkId
        - nationality
        - phone
        - vehicleLicensePlate
        - documentType
        - documentNumber
        - createdAt

    UpsertUserBody:
      type: object
      properties:
        name:
          type: string
        nationality:
          type: string
          enum: [BR, US]
        phone:
          type: string
        vehicleLicensePlate:
          type: string
        documentType:
          type: string
        documentNumber:
          type: string
      required:
        - nationality
        - phone
        - vehicleLicensePlate
        - documentType
        - documentNumber

    UpdateLocationBody:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
      required:
        - lat
        - lng

    LocationUpdateResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    Sighting:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        animalType:
          type: string
        description:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        timestamp:
          type: string
        nearbyUserCount:
          type: integer
      required:
        - id
        - userId
        - animalType
        - lat
        - lng
        - timestamp
        - nearbyUserCount

    CreateSightingBody:
      type: object
      properties:
        animalType:
          type: string
        description:
          type: string
        lat:
          type: number
        lng:
          type: number
      required:
        - animalType
        - lat
        - lng

    NearbyUsersResult:
      type: object
      properties:
        count:
          type: integer
        suppressed:
          type: boolean
        threshold:
          type: integer
      required:
        - count
        - suppressed
        - threshold

    Subscription:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        animalType:
          type: string
        emailNotify:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - userId
        - animalType
        - emailNotify
        - createdAt

    CreateSubscriptionBody:
      type: object
      properties:
        animalType:
          type: string
        emailNotify:
          type: boolean
      required:
        - animalType

    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
          enum: [sighting, emergency, system]
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        sightingId:
          type: ["integer", "null"]
        emergencyId:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - userId
        - type
        - title
        - body
        - read
        - createdAt

    BatchUpdateResult:
      type: object
      properties:
        updated:
          type: integer
      required:
        - updated

    Emergency:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        description:
          type: ["string", "null"]
        resolved:
          type: boolean
        createdAt:
          type: string
        resolvedAt:
          type: ["string", "null"]
      required:
        - id
        - userId
        - lat
        - lng
        - resolved
        - createdAt

    CreateEmergencyBody:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        description:
          type: string
      required:
        - lat
        - lng

    StatsOverview:
      type: object
      properties:
        totalSightings:
          type: integer
        totalUsers:
          type: integer
        activeEmergencies:
          type: integer
        sightingsToday:
          type: integer
        mostSpottedAnimal:
          type: ["string", "null"]
      required:
        - totalSightings
        - totalUsers
        - activeEmergencies
        - sightingsToday

    AnimalBreakdownItem:
      type: object
      properties:
        animalType:
          type: string
        count:
          type: integer
      required:
        - animalType
        - count

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [sighting, emergency]
        animalType:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        userName:
          type: ["string", "null"]
        lat:
          type: number
        lng:
          type: number
        timestamp:
          type: string
      required:
        - id
        - kind
        - lat
        - lng
        - timestamp
